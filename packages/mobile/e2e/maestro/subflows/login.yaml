appId: com.scholarmancy.app
---
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
# On CI emulators a clear-state relaunch can race the previous task's teardown, which
# kills the new process and leaves the app on its splash screen. Relaunch until the
# sign-in screen shows.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: deny
      - extendedWaitUntil:
          visible:
            id: input-email
          timeout: 40000
- tapOn:
    id: input-email
- inputText:
    text: ${MAESTRO_PARENT_EMAIL}
    label: Type parent email
- tapOn:
    id: input-password
- inputText:
    text: ${MAESTRO_PARENT_PASSWORD}
    label: Type parent password
# The password field submits on Return (onSubmitEditing). hideKeyboard is unreliable on
# iOS simulators, and the keyboard can cover the Sign In button.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: students-list
    timeout: 60000
