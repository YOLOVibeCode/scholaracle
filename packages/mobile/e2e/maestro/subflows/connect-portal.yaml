# From the "No portal connected" alert to a saved portal on this device.
appId: com.scholarmancy.app
---
- tapOn: Connect
- tapOn:
    id: button-provider-${MAESTRO_PORTAL_PROVIDER}
- tapOn:
    id: input-connect-url
# The field selects its template URL on focus; erase clears it before typing.
- eraseText: 300
- inputText: ${MAESTRO_PORTAL_URL}
- assertVisible:
    text: ${MAESTRO_PORTAL_URL}
- tapOn:
    id: button-connect-url-next
- tapOn:
    id: input-connect-username
- inputText:
    text: ${MAESTRO_PORTAL_USERNAME}
    label: Type portal username
- tapOn:
    id: input-connect-password
- inputText:
    text: ${MAESTRO_PORTAL_PASSWORD}
    label: Type portal password
- hideKeyboard
- tapOn:
    id: button-connect-save
# Saving shows a "Connected!" confirmation before returning to the dashboard.
- extendedWaitUntil:
    visible: "Connected!"
    timeout: 20000
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: button-sync
    timeout: 30000
- tapOn:
    id: button-sync
