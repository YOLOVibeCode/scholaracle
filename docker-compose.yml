version: '3.8'

# ⚠️ PORT POLICY: All ports are FIXED in the 28XX series and MUST NOT be changed.
# Changing these ports will break E2E tests, CI/CD pipelines, and documentation.
# Ports: 2800 (Web), 2801 (API), 2802 (MongoDB), 2803 (Mailpit SMTP), 2804 (Mailpit UI)

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: scholaracle-mongodb
    restart: unless-stopped
    ports:
      - "2802:27017"
    environment:
      MONGO_INITDB_DATABASE: scholaracle
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/scholaracle --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scholaracle-network

  # Mailpit - Email Testing Server
  mailpit:
    image: axllent/mailpit:latest
    container_name: scholaracle-mailpit
    restart: unless-stopped
    ports:
      - "2803:1025"  # SMTP server
      - "2804:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholaracle-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    container_name: scholaracle-api
    restart: unless-stopped
    ports:
      - "2801:3002"  # Main API port
    environment:
      NODE_ENV: development
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/scholaracle
      # External MongoDB URI (for host connections)
      MONGODB_URI_EXTERNAL: mongodb://localhost:2802/scholaracle
      MONGODB_DB_NAME: scholaracle
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      # Email configuration (SendGrid — remove SMTP_HOST to use SendGrid instead of Mailpit)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-notifications@scholarmancy.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Scholaracle}
      # SMTP_HOST: mailpit
      # SMTP_PORT: 1025
      # Twilio (optional)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Firebase (optional)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      SKIP_FIREBASE: ${SKIP_FIREBASE:-true}
      # Square (optional)
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_NOTIFICATION_URL: ${SQUARE_WEBHOOK_NOTIFICATION_URL:-}
      # Credential encryption (for storing data-source login credentials)
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      # AI (optional - for LLM material matching)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # CORS
      CORS_ORIGINS: http://localhost:2800,http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - scholaracle-network
    volumes:
      - ./packages/api:/app/packages/api
      - /app/node_modules

  # Web Application (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: development
    container_name: scholaracle-web
    restart: unless-stopped
    ports:
      - "2800:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:2801/api
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - scholaracle-network
    volumes:
      - ./packages/web:/app/packages/web
      - /app/node_modules
      - /app/.next

  # Workers (background jobs + browser scrapers)
  # Scale with: docker-compose up -d --scale workers=3
  # Each instance competes for jobs via atomic MongoQueue — no double-processing.
  # NOTE: Build with ./scripts/build-workers.sh first (copies scrapers into context).
  workers:
    image: scholaracle-workers:latest
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3003
      MONGODB_URI: mongodb://mongodb:27017/scholaracle
      MONGODB_DB_NAME: scholaracle
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      CONNECTOR_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      API_BASE_URL: http://api:3002
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      # Email configuration (SendGrid)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-notifications@scholarmancy.com}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Scholaracle}
      # SMTP_HOST: mailpit
      # SMTP_PORT: 1025
      # Twilio (optional)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Firebase (optional)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      SKIP_FIREBASE: ${SKIP_FIREBASE:-true}
      # AI (optional - for digest insights)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Scraping concurrency (Chromium instances per worker container)
      # Each browser uses ~300-500MB RAM. With 2GB limit, max ~3 concurrent.
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-2}
      SYNC_POLL_INTERVAL_MS: ${SYNC_POLL_INTERVAL_MS:-5000}
      # Playwright
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - scholaracle-network
    # Resource limits per instance (Playwright Chromium is memory-hungry)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  scholaracle-network:
    driver: bridge
