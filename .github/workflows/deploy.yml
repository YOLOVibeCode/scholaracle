name: Deploy

# Pipeline: main push → Railway auto-deploys dev instantly → this workflow
# verifies dev runs THIS commit and passes E2E. Production services have
# Railway "Wait for CI" (check suites) enabled, so prod only deploys after
# every check on the commit — CI gate, dev verification, E2E — is green.
#
# CI never runs `railway up`: Railway's GitHub integration owns deploys.
# (The old railway-up jobs required per-environment project tokens and had
# never successfully deployed anything.)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E gate (emergency break-glass only)'
        required: false
        default: false
        type: boolean

# Newest push wins: dev auto-deploys every push immediately, so a run for a
# superseded commit can never see its own SHA on dev again — it would only
# burn its timeout and fail. Cancelling it is correct: Railway's prod gate
# releases per-commit, and only the head commit's deploys should release.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_API_URL: https://api-dev-c268.up.railway.app
  DEV_WEB_URL: https://web-dev-8552.up.railway.app
  # Branded UAT domains — the exact hosts the TestFlight preview binary calls.
  # DNS/TLS breakage here would ship silently without these checks.
  UAT_API_URL: https://api-uat.scholarmancy.com
  UAT_WEB_URL: https://web-uat.scholarmancy.com

jobs:
  ci-check:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ─── Verify Railway's dev auto-deploy is running THIS commit ────────
  # /api/health/version reports RAILWAY_GIT_COMMIT_SHA, so a healthy
  # response from a stale deploy can't pass. Workers has no HTTP surface;
  # its deploy is observed indirectly (same image pipeline as the API).
  wait-for-dev:
    name: Wait for dev health
    needs: ci-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for dev API to run ${{ github.sha }}
        run: |
          for i in {1..80}; do
            deployed=$(curl -fsS "${DEV_API_URL}/api/health/version" 2>/dev/null | jq -r '.commit // "unreachable"' || echo "unreachable")
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "Dev API is running ${deployed}"; exit 0
            fi
            echo "Dev API on ${deployed}, waiting for ${{ github.sha }}... ($i/80)"
            sleep 10
          done
          echo "Dev API never picked up this commit"; exit 1
      - name: Wait for dev Web to run ${{ github.sha }}
        run: |
          for i in {1..80}; do
            deployed=$(curl -fsS "${DEV_WEB_URL}/api/health/version" 2>/dev/null | jq -r '.commit // "unreachable"' || echo "unreachable")
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "Dev Web is running ${deployed}"; exit 0
            fi
            echo "Dev Web on ${deployed}, waiting for ${{ github.sha }}... ($i/80)"
            sleep 10
          done
          echo "Dev Web never picked up this commit"; exit 1

      - name: Wait for UAT API domain to run ${{ github.sha }}
        run: |
          for i in {1..80}; do
            deployed=$(curl -fsS "${UAT_API_URL}/api/health/version" 2>/dev/null | jq -r '.commit // "unreachable"' || echo "unreachable")
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "UAT API is running ${deployed}"; exit 0
            fi
            echo "UAT API on ${deployed}, waiting for ${{ github.sha }}... ($i/80)"
            sleep 10
          done
          echo "UAT API (${UAT_API_URL}) never picked up this commit"; exit 1

      - name: Wait for UAT Web domain to run ${{ github.sha }}
        run: |
          for i in {1..80}; do
            deployed=$(curl -fsS "${UAT_WEB_URL}/api/health/version" 2>/dev/null | jq -r '.commit // "unreachable"' || echo "unreachable")
            if [ "$deployed" = "${{ github.sha }}" ]; then
              echo "UAT Web is running ${deployed}"; exit 0
            fi
            echo "UAT Web on ${deployed}, waiting for ${{ github.sha }}... ($i/80)"
            sleep 10
          done
          echo "UAT Web (${UAT_WEB_URL}) never picked up this commit"; exit 1

      - name: UAT mobile-contract smoke
        run: |
          # 1. Demo login — the first network call the TestFlight app makes.
          code=$(curl -sS -o /tmp/login-res -w "%{http_code}" -X POST \
            "${UAT_API_URL}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@scholarmancy.com","password":"DemoPass123!"}')
          echo "UAT demo login → $code"
          if [ "$code" != "200" ]; then
            echo "UAT demo login failed (${code}): $(cat /tmp/login-res)"
            exit 1
          fi
          # 2. Magic-link consume with a bogus token — must return 4xx, never 5xx.
          code=$(curl -sS -o /tmp/magic-res -w "%{http_code}" -X POST \
            "${UAT_API_URL}/api/auth/magic" \
            -H "Content-Type: application/json" \
            -d '{"token":"ci-smoke-bogus-token"}')
          echo "UAT magic consume (bogus) → $code"
          if [ "${code:0:1}" = "5" ]; then
            echo "UAT magic endpoint returned 5xx (${code}): $(cat /tmp/magic-res)"
            exit 1
          fi
          echo "UAT mobile-contract smoke passed"

      - name: App Store legal pages reachable without a session
        run: |
          for path in /privacy /terms /support /delete-account /robots.txt /sitemap.xml; do
            code=$(curl -sS -o /tmp/store-page -w "%{http_code}" -L "${DEV_WEB_URL}${path}")
            echo "$path → $code"
            if [ "$code" != "200" ]; then
              echo "App Review cannot load ${DEV_WEB_URL}${path}"
              exit 1
            fi
          done
          curl -fsS "${DEV_WEB_URL}/privacy" | grep -qi "Sign in with Apple"
          curl -fsS "${DEV_WEB_URL}/delete-account" | grep -qi "privacy@scholarmancy.com"

  # ─── E2E against the freshly-deployed dev environment ───────────────
  e2e-dev:
    name: E2E vs dev
    needs: wait-for-dev
    if: ${{ !inputs.skip_e2e }}
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    with:
      base_url: https://web-dev-8552.up.railway.app
      # Origin only: global-setup and helpers append /api themselves.
      api_base_url: https://api-dev-c268.up.railway.app
      # Deployed-environment gate: the layered chain (critical → auth → dashboard →
      # navigation → feature). The full suite, including Mailpit-dependent and fake-portal
      # specs, runs on localhost for every PR; against dev it exceeded the 30-minute limit.
      project: feature

  # ─── OTA update → TestFlight preview channel ─────────────────────────
  # Runs after E2E (or wait-for-dev if E2E is skipped).
  # Compares HEAD @expo/fingerprint output to the latest finished EAS preview
  # build per platform (iOS + Android). A missing token or hash fails the job;
  # a fingerprint mismatch (expected after native changes) skips the OTA with a
  # "binary required" summary but does not fail the Deploy run, which Railway's
  # production gate waits on.
  # Production channel is intentionally NOT automated here — keep it manual
  # so the binary under App Review never shifts mid-review.
  ota-preview:
    name: OTA → TestFlight preview
    # wait-for-dev is always required; e2e-dev may be skipped via skip_e2e.
    # !failure() lets this job run even when e2e-dev was skipped (not failed).
    needs: [wait-for-dev, e2e-dev]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the preview build's commit must be reachable for the fingerprint check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            {
              echo "## binary required"
              echo ""
              echo "**EXPO_TOKEN** is not configured. Add it in the repo secrets, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check native fingerprints vs preview builds
        id: fingerprint
        run: |
          set -euo pipefail
          # Compare two fingerprints computed HERE, in CI: HEAD, and the commit each latest preview
          # build was made from. The hash EAS records for a build is computed on EAS's servers and
          # never equals a CI hash for the same sources (measured: same commit, different hashes on
          # EAS, a Mac, and CI), so it cannot be compared. eas.json is excluded through
          # packages/mobile/.fingerprintignore, applied to both sides.
          summary() {
            {
              echo "## $1"
              echo ""
              echo "$2"
              echo ""
              echo "| | iOS | Android |"
              echo "| --- | --- | --- |"
              echo "| Latest preview build commit | \`${BUILD_IOS_COMMIT:0:9}\` | \`${BUILD_ANDROID_COMMIT:0:9}\` |"
              echo "| Fingerprint at that commit | \`${BUILD_IOS_FP:-}\` | \`${BUILD_ANDROID_FP:-}\` |"
              echo "| Fingerprint at HEAD | \`${CURRENT_IOS:-}\` | \`${CURRENT_ANDROID:-}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          skip() {
            summary "binary required" "$1 OTA skipped; build a new preview binary (\`pnpm build:ios:preview\`, \`pnpm build:android:preview\`)."
            echo "::warning title=binary required::$1 OTA skipped until a new preview binary is built."
            echo "match=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          commit_for() {
            npx eas-cli build:list --platform "$1" --profile preview --status finished \
              --limit 1 --non-interactive --json \
              | jq -r 'if (type == "array" and length > 0) then (.[0].gitCommitHash // empty) else empty end'
          }
          fp_here() {
            npx @expo/fingerprint fingerprint:generate --platform "$1" | jq -r '.hash // empty'
          }
          # Fingerprint of the sources at commit $1 for platform $2, in a throwaway worktree with
          # its own install and HEAD's ignore file.
          fp_at() {
            local dir="$RUNNER_TEMP/fp-$1"
            if [ ! -d "$dir" ]; then
              git worktree add --detach "$dir" "$1" >/dev/null
              cp "$GITHUB_WORKSPACE/packages/mobile/.fingerprintignore" "$dir/packages/mobile/.fingerprintignore"
              (cd "$dir" && pnpm install --frozen-lockfile >/dev/null)
            fi
            (cd "$dir/packages/mobile" && npx @expo/fingerprint fingerprint:generate --platform "$2" | jq -r '.hash // empty')
          }

          CURRENT_IOS=$(fp_here ios)
          CURRENT_ANDROID=$(fp_here android)
          BUILD_IOS_COMMIT=$(commit_for ios)
          BUILD_ANDROID_COMMIT=$(commit_for android)
          if [ -z "$CURRENT_IOS" ] || [ -z "$CURRENT_ANDROID" ]; then
            summary "binary required" "Could not compute the HEAD fingerprint (iOS and/or Android)."
            exit 1
          fi
          if [ -z "$BUILD_IOS_COMMIT" ] || [ -z "$BUILD_ANDROID_COMMIT" ]; then
            summary "binary required" "No finished **preview** build with a recorded git commit for both platforms."
            exit 1
          fi
          for c in "$BUILD_IOS_COMMIT" "$BUILD_ANDROID_COMMIT"; do
            git cat-file -e "$c^{commit}" 2>/dev/null || skip "Preview build commit \`${c:0:9}\` is not in this repository's history."
          done
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$BUILD_IOS_COMMIT" = "$HEAD_SHA" ]; then BUILD_IOS_FP=$CURRENT_IOS; else BUILD_IOS_FP=$(fp_at "$BUILD_IOS_COMMIT" ios); fi
          if [ "$BUILD_ANDROID_COMMIT" = "$HEAD_SHA" ]; then BUILD_ANDROID_FP=$CURRENT_ANDROID; else BUILD_ANDROID_FP=$(fp_at "$BUILD_ANDROID_COMMIT" android); fi
          if [ -z "$BUILD_IOS_FP" ] || [ -z "$BUILD_ANDROID_FP" ]; then
            skip "Could not compute the fingerprint at the preview build commit."
          fi
          if [ "$CURRENT_IOS" != "$BUILD_IOS_FP" ] || [ "$CURRENT_ANDROID" != "$BUILD_ANDROID_FP" ]; then
            # Expected after any native change. Do NOT fail: this job is part of the Deploy run that
            # Railway's production gate waits on, so failing here would block backend deploys.
            skip "Native code changed since the latest preview builds."
          fi
          echo "match=true" >> "$GITHUB_OUTPUT"
          summary "Fingerprint check passed" "HEAD has the same native fingerprint as the commit the latest **preview** builds were made from (iOS and Android), computed in the same environment."

      - name: Publish OTA to preview channel
        if: steps.fingerprint.outputs.match == 'true'
        env:
          OTA_UPDATE_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          npx eas-cli update \
            --channel preview \
            --environment preview \
            --message "$OTA_UPDATE_MESSAGE" \
            --non-interactive
