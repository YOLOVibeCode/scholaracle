name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  gitleaks:
    name: Gitleaks
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          v="${{ env.GITLEAKS_VERSION }}"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

  quality:
    name: Quality Gate (Lint & Format)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint (strict — warnings fail CI)
        run: pnpm lint:strict

      - name: Format check
        run: pnpm format:check

      - name: Scraper page-fns generated file check
        run: pnpm --filter @scholaracle/scraper-core page-fns:check

  test:
    name: Test (${{ matrix.package }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - contracts
          - connector
          - database
          - agents
          - auth
          - api
          - web
          - workers
          - mobile
          - scraper-core
          - studio-core
          - browser-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Re-link file dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/web/.next
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

      - name: Cache MongoDB binary
        if: matrix.package != 'connector' && matrix.package != 'web'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run tests with coverage
        run: |
          set -uo pipefail
          pnpm --filter @scholaracle/${{ matrix.package }} test:coverage 2>&1 | tee /tmp/test-output.txt
          test_exit=${PIPESTATUS[0]}
          if grep -qE 'Test Suites:.*[1-9][0-9]* failed' /tmp/test-output.txt; then
            echo "Tests failed (suites)"
            exit 1
          fi
          if grep -qE 'Tests:.*[1-9][0-9]* failed' /tmp/test-output.txt; then
            echo "Tests failed"
            exit 1
          fi
          if grep -q 'No tests found' /tmp/test-output.txt; then
            echo "No tests matched"
            exit 1
          fi
          if grep -qE 'Tests:[[:space:]]+0 total' /tmp/test-output.txt; then
            echo "Zero tests executed"
            exit 1
          fi
          if grep -q 'Test Suites: 0 passed, 0 total' /tmp/test-output.txt; then
            echo "Zero test suites executed"
            exit 1
          fi
          if ! grep -q 'Test Suites:' /tmp/test-output.txt || ! grep -q 'Tests:' /tmp/test-output.txt; then
            echo "Jest did not print a complete summary"
            exit 1
          fi
          if [ "$test_exit" -ne 0 ]; then
            # Jest --forceExit can exit 1 with all tests green when handles linger
            if grep -qE 'Test Suites:.*[0-9]+ passed, [0-9]+ total' /tmp/test-output.txt \
              && grep -qE 'Tests:.*[0-9]+ passed' /tmp/test-output.txt \
              && ! grep -qE 'Tests:.*[1-9][0-9]* failed' /tmp/test-output.txt; then
              echo "All tests passed (non-zero exit treated as forceExit noise)"
              exit 0
            fi
            exit "$test_exit"
          fi
          echo "All tests passed"
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 7

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Re-link file dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scrapers dependency
        run: |
          # Symlink monorepo packages for scholaracle_scrapers file: deps (@scholaracle/contracts, @scholaracle/scraper-core)
          mkdir -p /home/runner/work/scholarmancy/scholaracle/packages
          ln -sf /home/runner/work/scholaracle/scholaracle/packages/contracts /home/runner/work/scholarmancy/scholaracle/packages/contracts
          ln -sf /home/runner/work/scholaracle/scholaracle/packages/scraper-core /home/runner/work/scholarmancy/scholaracle/packages/scraper-core
          cd /home/runner/work/scholaracle/scholaracle && pnpm --filter @scholaracle/contracts build && pnpm --filter @scholaracle/scraper-core build
          cd /home/runner/work/scholaracle_scrapers && npm install && npx tsc --build

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/**/*.ts', 'packages/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build all packages
        run: pnpm build

      - name: Type check (after build)
        run: pnpm type-check

      - name: Cache build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/dist
            packages/web/.next
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

  docker-build:
    name: Docker build (pre-deploy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: scholaracle-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy scrapers for Workers build
        run: cp -r /home/runner/work/scholaracle_scrapers ./.scrapers

      - name: Build Workers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workers
          push: false
          tags: scholaracle-workers:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: scholaracle-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile-bundle:
    name: Mobile bundle check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Re-link file dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (mobile type dependency)
        run: pnpm --filter @scholaracle/contracts build

      - name: Export iOS bundle (catches Metro/bundle breaks)
        working-directory: packages/mobile
        run: npx expo export --platform ios --output-dir /tmp/expo-export
