name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  quality:
    name: Quality Gate (Lint & Format)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint (strict — warnings fail CI)
        run: pnpm lint:strict

      - name: Format check
        run: pnpm format:check

  test:
    name: Test (${{ matrix.package }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - contracts
          - connector
          - database
          - agents
          - auth
          - api
          - web
          - workers
          - mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Re-link file dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/web/.next
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

      - name: Cache MongoDB binary
        if: matrix.package != 'connector' && matrix.package != 'web'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run tests with coverage
        run: |
          set +e
          pnpm --filter @scholaracle/${{ matrix.package }} test:coverage 2>&1 | tee /tmp/test-output.txt
          EXIT_CODE=$?
          # Jest --forceExit returns 1 even when all tests pass if there are open handles
          if grep -q "Test Suites:.*failed" /tmp/test-output.txt; then
            echo "Tests failed"
            exit 1
          fi
          if grep -q "Tests:.*failed" /tmp/test-output.txt; then
            echo "Tests failed"
            exit 1
          fi
          if ! grep -q "Tests:" /tmp/test-output.txt; then
            echo "No test output found"
            exit $EXIT_CODE
          fi
          echo "All tests passed"
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 7

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Re-link file dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scrapers dependency
        run: |
          # Create symlink so scrapers can resolve @scholaracle/contracts
          mkdir -p /home/runner/work/scholarmancy/scholaracle/packages
          ln -s /home/runner/work/scholaracle/scholaracle/packages/contracts /home/runner/work/scholarmancy/scholaracle/packages/contracts
          # Build contracts first (scrapers depend on it)
          cd /home/runner/work/scholaracle/scholaracle && pnpm --filter @scholaracle/contracts build
          # Install and build scrapers
          cd /home/runner/work/scholaracle_scrapers && npm install && npx tsc --build

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: packages/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/**/*.ts', 'packages/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build all packages
        run: pnpm build

      - name: Type check (after build)
        run: pnpm type-check

      - name: Cache build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/dist
            packages/web/.next
          key: build-artifacts-${{ runner.os }}-${{ github.sha }}

  docker-build:
    name: Docker build (pre-deploy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: scholaracle-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy scrapers for Workers build
        run: cp -r /home/runner/work/scholaracle_scrapers ./.scrapers

      - name: Build Workers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workers
          push: false
          tags: scholaracle-workers:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: scholaracle-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile-bundle:
    name: Mobile bundle check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout scrapers repo
        run: git clone --depth 1 https://github.com/YOLOVibeCode/scholaracle_scrapers.git /home/runner/work/scholaracle_scrapers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Re-link file dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (mobile type dependency)
        run: pnpm --filter @scholaracle/contracts build

      - name: Export iOS bundle (catches Metro/bundle breaks)
        working-directory: packages/mobile
        run: npx expo export --platform ios --output-dir /tmp/expo-export
